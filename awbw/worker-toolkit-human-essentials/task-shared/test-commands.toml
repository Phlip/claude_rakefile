[salesform]
notes = "Ruby 3.2.1, Rails / Bullet Train, Minitest (`bin/rails test`, salesform_test DB provisioned by the image entrypoint). Boots in :test with NO master key (require_master_key unset; Rails auto-generates the test secret), bin/rails baked via railsBinstub. Per-test re-seed slowness FIXED at the member tip: test_helper seeds the roles/languages reference data ONCE (kept out of DatabaseCleaner's :deletion) — the full suite dropped from hours to ~43s (285 runs, serial: PARALLEL_WORKERS=1; parallel hits a DRb Proc-marshal crash). SUITE INTENTIONALLY NOT WIRED (skip, per a clean-baseline pass): ~41 of the 285 are DEEP, varied pre-existing reconstruction/behavioral failures — Xkit CRM-sync worker tests (booking_worker: host/prospect not synced), account controller tests, and Booking model validity, plus scattered NoMethodErrors (prospect=, host, email=, starts_with on nil). These are not a few schema-confirmed gaps (Booking uses `has_many :prospects, through: :guests`, so restoring a direct `belongs_to :prospect` for the vestigial prospect_id is a guess), so fixing them faithfully needs the original source — a reconstruction-fidelity follow-up, not blind edits. Leaving it unwired keeps the grader baseline clean."

[skunkworks]
notes = "Ruby 3.3.0, Rails / Bullet Train, Minitest (`bin/rails test`, skunkworks_test DB; bin/rails baked via railsBinstub). One boot blocker FIXED: config/initializers/pinecone.rb reads PINECONE_API_KEY + PINECONE_ENVIRONMENT via ENV.fetch (no default) at boot — baked as dummy imageEnv; the image builds and gets further. But the full suite is BLOCKED (skip, not possible): (1) the JS deps require `@fortawesome/fontawesome-pro` (^6.5.1) from the PAID private registry npm.fontawesome.com — .yarnrc.yml/.npmrc gate the @fortawesome scope on FONTAWESOME_NPM_AUTH_TOKEN we don't have, so cssbundling's `yarn install` at test:prepare aborts (`Failed to replace env in config: ${FONTAWESOME_NPM_AUTH_TOKEN}`); app/javascript/application.js:26 also `require`s its CSS. (2) A secondary OpenSSL boot error `pbkdf2_hmac: no implicit conversion of Array into String` (secret-derivation, from config/environment.rb:5). Greening needs the paid FontAwesome license (or stripping the commercial dep from the app + fixing pbkdf2) — outside what onboarding should invent. Uses transactional fixtures, so it'd be fast if unblocked."

[odder-web]
notes = "Ruby 3.3.5, Rails / Jumpstart Pro, Minitest (odder_web_test DB; bin/rails baked via railsBinstub). GREEN, clean baseline, no manual steps: `RAILS_ENV=test bin/rails test` → 233 runs, 0 failures, 0 errors, 3 skips. Getting here took a member build-repair chain (all re-pinned): regenerated config/credentials/test.key + test.yml.enc (scrub dropped the whitelisted key) carrying secret_key_base + prefixed_ids.salt + the active_record_encryption keys the app requires; restored the vendored .yarn/releases/yarn-4.4.0.cjs + reconciled yarn.lock; image bakes Node 22.13.0 + yarn (frontend flag; yarn 1.22 delegates to the vendored yarn 4 via yarnPath) so cssbundling's css:build runs at test:prepare. The 3 skips are Jumpstart payment-flow boilerplate (need a live Stripe processor, not the app's logic). Transactional fixtures — fast."

