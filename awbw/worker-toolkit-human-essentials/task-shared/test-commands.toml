# Per-repo deterministic-signal checks for the grader.
#
# tests/test.sh runs these against the workspace after the agent's changes and
# feeds the output to the grader to inform the correctness score. A repo with no
# entry gets no signals.
#
# Schema: one [<repo>] table (optional: notes, memory_mb, setup) then one
# [[<repo>.checks]] per check (name, cmd, optional baseline_known_failures).
# cmd runs from the workspace root; a non-zero exit is a signal, not an error.
# Browser E2E is excluded everywhere (flaky). confidence: validated | derived |
# inferred | none.
#
# Checks run inside the task's `memory_mb` container. test.sh sizes Node's heap to
# it and exports RACCOON_CHECK_WORKERS (the cpu quota) plus the VITEST_* pool vars;
# jest reads no env var, so a jest cmd must pass --maxWorkers itself.

# confidence: validated
[Palolo-031]
notes = "TS Node20/pnpm8 vitest monorepo (Prisma+Postgres)"
memory_mb = 8192
setup = "cd packages/server && pnpm run prisma generate"

[[Palolo-031.checks]]
name = "vitest (monorepo, all packages)"
cmd = "TZ=UTC PUBLIC_BAAS_ENABLED=yes DEFAULT_BAAS_PROVIDER=Liquid pnpm run test --run --testTimeout=30000 --hookTimeout=60000"
baseline_known_failures = [
  "Shared-test-DB contention under parallel load, intermittent: ordering race in packages/server/src/db/financial-accounts.spec.ts > \"Hidden accounts\" (5s hook/test timeout), parallel-load race in packages/server/src/db/client.spec.ts > \"ambient db transactions\"; also surfaces as beforeEach/hook timeouts and \"25P02 current transaction is aborted\" cascades in otherwise-unrelated server specs. Appear/disappear between runs of identical code; not app defects. Runtime-observed 2026-08-09.",
  "packages/server/src/services/baas/liquid.spec.ts > simple Liquid integration tests > expected inserts — order-dependent flake (exact row-count assertion on a table shared across parallel spec files); fails on an unmodified tree in roughly half of full parallel runs and passes in isolation and under --no-file-parallelism.",
]

[[Palolo-031.checks]]
name = "eslint"
# Per package, not one pass over the monorepo: `projectService: true` makes a single
# process hold type-aware programs for every package at once, which no heap cap fits.
# Same 906 files (packages/* is the whole lint surface). The find guard skips
# packages with no TS sources, where eslint exits 2 — also its fatal-config code.
# Raise the heap past the 4096 that prior-era test.sh copies hardcode: 8 packages of
# type-aware linting abort at that cap on modal (exit 134). 6 GB fits memory_mb.
cmd = "export NODE_OPTIONS=\"${NODE_OPTIONS:-} --max-old-space-size=6144\"; rc=0; for d in packages/*/; do [ -z \"$(find \"$d\" -path '*/node_modules' -prune -o \\( -name '*.ts' -o -name '*.tsx' -o -name '*.mts' -o -name '*.cts' \\) -print -quit)\" ] && continue; pnpm run lint \"$d\" || rc=1; done; exit $rc"

[[Palolo-031.checks]]
name = "tsc typecheck (all packages)"
cmd = "pnpm run types"

