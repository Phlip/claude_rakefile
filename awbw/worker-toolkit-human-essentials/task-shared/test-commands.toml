notes = "Elixir 1.13.3 / OTP 23, Phoenix, ExUnit. The harbor base is pinned to the hexpm elixir 1.13.3 + erlang 23.3.4.11 combo (baseImage) because the official elixir:1.13.3 bundles OTP 24, which removed :crypto.block_encrypt — the old Cloak AES.GCM cipher this app uses calls it, so the whole suite crashed (658 failures) on the official image; xkit's .tool-versions pins OTP 23. The ~20 config/runtime.exs env_var!s are baked as dummy imageEnv (VAULT_KEY is a valid base64 32-byte for Cloak; CUSTOMER_LAMBDA_LAYER_ARN is the literal value the AwsMock's @layer_request_url encodes). `mix ecto.create && migrate && mix test` now RUNS — 933 tests, ~46 failures on dummy env (the explore image with real secrets sees ~15; the delta is dummy JWT key + a few unmatched Tesla mocks). Kept on `mix compile --force` as the wired check — the 46 are varied (match/assert/mock) and not cleanly wireable to 0 without the original .env; the full suite is a runnable reference for task authors."

[[xkit.checks]]
name = "mix compile"
